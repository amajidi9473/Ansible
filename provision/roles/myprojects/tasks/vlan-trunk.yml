---

# Define how many VLANs to create and which trunks each inventory host should
# receive them on. For example, sw5 targets two Ethernet links and one port
# channel, while sw6 can have a different number of interfaces.
- name: Define dynamic VLAN settings
  ansible.builtin.set_fact:
    vlan_count: 3  # Number of consecutive VLANs to create.
    trunk_interfaces_by_host:  # Editable interface list for each switch.
      sw5:
        - Ethernet1/10
        - Ethernet1/11
        - port-channel700
      sw6:
        - Ethernet1/10
        - Ethernet1/12
        - Ethernet1/13
        - port-channel700
  tags:
    - dynamic-vlan

# Select only the interface list belonging to the device currently executing
# the task. For example, inventory host sw5 receives the list under the sw5 key.
- name: Select trunk interfaces for this device
  ansible.builtin.set_fact:
    trunk_interfaces: >-
      {{ trunk_interfaces_by_host[inventory_hostname] | default([]) }}
  tags:
    - dynamic-vlan

# Stop early when the current inventory host has no target interfaces. This
# prevents VLAN creation when there is nowhere for the new VLANs to be applied.
- name: Validate that this device has target trunk interfaces
  ansible.builtin.assert:
    that:
      - trunk_interfaces | length > 0  # Require at least one target interface.
    fail_msg: >-
      Add at least one interface for {{ inventory_hostname }} under
      trunk_interfaces_by_host at the beginning of this file.
  tags:
    - dynamic-vlan

# Read the VLAN database from the Nexus switch in structured form. This task is
# read-only. For example, it may return VLAN IDs 1, 10, 100, and 3200.
- name: Gather existing VLAN configuration
  cisco.nxos.nxos_vlans:
    state: gathered  # Collect VLAN state without changing the device.
  register: vlan_state  # Save the gathered VLAN data for later calculations.
  tags:
    - dynamic-vlan

# Read Layer 2 settings for Ethernet and port-channel interfaces. This is also
# read-only and provides each interface's trunk and allowed-VLAN information.
- name: Gather existing Layer 2 interface configuration
  cisco.nxos.nxos_l2_interfaces:
    state: gathered  # Collect Layer 2 interface state without changing it.
  register: l2_state  # Save gathered interface data for validation and merging.
  tags:
    - dynamic-vlan

# Convert gathered VLAN IDs to integers and retain only interfaces listed for
# the current host. For example, unrelated Ethernet and port-channel interfaces
# are excluded from matching_trunks.
- name: Normalize existing VLAN and trunk data
  ansible.builtin.set_fact:
    existing_vlan_ids: >-
      {{ vlan_state.gathered
         | map(attribute='vlan_id')
         | map('int')
         | list }}
    matching_trunks: >-
      {{ l2_state.gathered
         | selectattr('name', 'in', trunk_interfaces)
         | list }}
  tags:
    - dynamic-vlan

# Confirm VLAN data exists and every requested interface was found. For example,
# requesting three interfaces but gathering only two causes a safe failure
# before the switch configuration tasks begin.
- name: Validate gathered VLAN and trunk data before making changes
  ansible.builtin.assert:
    that:
      - existing_vlan_ids | length > 0  # Require usable VLAN data.
      - matching_trunks | length == trunk_interfaces | length  # Require every requested interface.
    fail_msg: >-
      The device must have VLAN data, and every configured target interface
      must exist. Requested: {{ trunk_interfaces | join(', ') }}. Found:
      {{ matching_trunks | map(attribute='name') | join(', ') }}.
  tags:
    - dynamic-vlan

# Validate each selected interface before creating VLANs. Ethernet interfaces
# and port channels are both accepted when gathered as trunks, but an access
# interface or a trunk explicitly allowing no VLANs causes the workflow to stop.
- name: Validate every selected interface is a usable trunk
  ansible.builtin.assert:
    that:
      - item.trunk is defined  # Require Layer 2 trunk attributes.
      - not (item.trunk.allowed_vlans_none | default(false) | bool)  # Reject "allowed vlan none".
    fail_msg: >-
      {{ item.name }} must be a trunk and must not be configured with
      "allowed vlan none".
  loop: "{{ matching_trunks }}"
  loop_control:
    label: "{{ item.name }}"  # Show the current interface in task output.
  tags:
    - dynamic-vlan

# Combine VLAN IDs gathered from every switch in the current play. This ensures
# all targeted switches calculate the same new IDs even when their existing
# VLAN databases differ.
- name: Combine existing VLAN IDs from every targeted device
  ansible.builtin.set_fact:
    all_existing_vlan_ids: >-
      {{ ansible_play_hosts
         | map('extract', hostvars, 'existing_vlan_ids')
         | flatten
         | map('int')
         | list }}
  tags:
    - dynamic-vlan

# Find the highest VLAN ID across all targeted switches. For example, when one
# switch ends at 3100 and another ends at 3200, the selected value is 3200.
- name: Calculate the largest existing VLAN ID
  ansible.builtin.set_fact:
    largest_vlan_id: "{{ all_existing_vlan_ids | max | int }}"  # Convert the maximum value to an integer.
  tags:
    - dynamic-vlan

# Ensure the requested number of new VLANs will remain inside the valid NX-OS
# VLAN range. For example, three VLANs cannot be created after VLAN 4092.
- name: Validate room for the requested VLANs
  ansible.builtin.assert:
    that:
      - largest_vlan_id | int + vlan_count | int <= 4094  # Keep the final ID at or below 4094.
    fail_msg: >-
      Cannot create {{ vlan_count }} VLANs after VLAN {{ largest_vlan_id }}
      because NX-OS VLAN IDs cannot exceed 4094.
  tags:
    - dynamic-vlan

# Generate the requested number of consecutive VLAN IDs immediately after the
# current maximum. For example, maximum 3200 with vlan_count 3 produces
# 3201, 3202, and 3203.
- name: Calculate the next VLAN IDs
  ansible.builtin.set_fact:
    new_vlan_ids: >-
      {{ range(
           largest_vlan_id | int + 1,
           largest_vlan_id | int + vlan_count | int + 1
         ) | list }}
  tags:
    - dynamic-vlan

# Print a short, read-only summary before configuration. It shows the shared
# maximum, generated VLAN IDs, and the target interfaces for the current switch.
- name: Display the planned dynamic VLAN changes
  ansible.builtin.debug:
    msg:
      - "Largest VLAN across targeted devices: {{ largest_vlan_id }}"
      - "VLANs to create: {{ new_vlan_ids | join(',') }}"
      - >-
        Target trunks on {{ inventory_hostname }}:
        {{ trunk_interfaces | join(', ') }}
  tags:
    - dynamic-vlan

# Create each calculated VLAN with a predictable name. The merged state adds
# the requested VLAN without deleting or replacing other VLANs. For example,
# VLAN 3201 is named ansible-vlan-3201.
- name: Create new VLANs without affecting existing VLANs
  cisco.nxos.nxos_vlans:
    config:
      - vlan_id: "{{ item }}"  # Use the current generated VLAN ID.
        name: "ansible-vlan-{{ item }}"  # Build a readable VLAN name.
        enabled: true  # Administratively enable the VLAN.
        state: active  # Set its operational state to active.
    state: merged  # Add the VLAN while preserving all other VLANs.
  loop: "{{ new_vlan_ids }}"
  tags:
    - dynamic-vlan

# Add the new VLANs to every selected trunk that already has an explicit
# allowed-VLAN list. With merged state, NX-OS adds only missing VLANs and keeps
# the interface's existing allowed VLANs.
- name: Merge new VLANs into the explicit trunk allowed list
  cisco.nxos.nxos_l2_interfaces:
    config:
      - name: "{{ item.name }}"  # Use the canonical name gathered from NX-OS.
        trunk:
          allowed_vlans: "{{ new_vlan_ids | join(',') }}"  # Supply only the new VLAN IDs.
    state: merged  # Add missing VLANs without replacing the existing list.
  loop: "{{ matching_trunks }}"
  loop_control:
    label: "{{ item.name }}"  # Show the current trunk in task output.
  when: item.trunk.allowed_vlans | default('') | string | length > 0  # Act only on explicit lists.
  tags:
    - dynamic-vlan

# Report why no interface command was sent when a trunk has no explicit list.
# NX-OS allows all VLANs on such a trunk by default, so the newly created VLANs
# are already permitted and restricting the list would be unnecessary.
- name: Report when no trunk update is required
  ansible.builtin.debug:
    msg: >-
      {{ item.name }} has no explicit allowed VLAN list, so NX-OS already
      allows the newly created VLANs and no trunk change was sent.
  loop: "{{ matching_trunks }}"
  loop_control:
    label: "{{ item.name }}"  # Show which trunk already allows all VLANs.
  when: item.trunk.allowed_vlans | default('') | string | length == 0  # Report default allow-all trunks.
  tags:
    - dynamic-vlan
