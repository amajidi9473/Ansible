---

- name: Define ACL insertion settings
  ansible.builtin.set_fact:
    acl_name: Internet-Control-in
    sequence_start: 1100
    sequence_end: 8000
    default_acl_target_ips:
      - 192.168.253.240/32
      - 192.168.253.241/32
      - 192.168.253.242/32
  tags:
    - dynamic-acl

- name: Resolve addresses supplied by automation
  ansible.builtin.set_fact:
    effective_acl_target_ips: >-
      {{ acl_target_ips | default(default_acl_target_ips) }}
  tags:
    - dynamic-acl

- name: Validate ACL settings and address collection
  ansible.builtin.assert:
    that:
      - acl_name | length > 0
      - sequence_start | int >= 1
      - sequence_end | int <= 4294967294
      - sequence_start | int <= sequence_end | int
      - effective_acl_target_ips is sequence
      - effective_acl_target_ips is not string
      - effective_acl_target_ips | length > 0
      - effective_acl_target_ips | length == effective_acl_target_ips | unique | length
    fail_msg: >-
      The ACL name, sequence range, or address collection is invalid. Supply a
      nonempty, duplicate-free list through acl_target_ips.
  tags:
    - dynamic-acl

- name: Validate every address is a correct IPv4 prefix
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$')
      - >-
        item | regex_replace('/32$', '') | split('.') | map('int')
        | select('greaterthan', 255) | list | length == 0
    fail_msg: >-
      {{ item }} is invalid. Every acl_target_ips entry must be a valid IPv4
      address with a /32 prefix.
  loop: "{{ effective_acl_target_ips }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - dynamic-acl

- name: Gather existing ACL configuration
  cisco.nxos.nxos_acls:
    state: gathered
  register: gathered_acl_state
  tags:
    - dynamic-acl

- name: Select gathered IPv4 ACL data
  ansible.builtin.set_fact:
    ipv4_acl_families: >-
      {{ gathered_acl_state.gathered
         | selectattr('afi', 'equalto', 'ipv4')
         | list }}
  tags:
    - dynamic-acl

- name: Validate IPv4 ACL data is available
  ansible.builtin.assert:
    that:
      - ipv4_acl_families | length == 1
    fail_msg: >-
      The device did not return exactly one IPv4 ACL configuration section.
      No ACL changes were made.
  tags:
    - dynamic-acl

- name: Select the requested existing ACL
  ansible.builtin.set_fact:
    matching_acls: >-
      {{ ipv4_acl_families[0].acls
         | default([])
         | selectattr('name', 'equalto', acl_name)
         | list }}
  tags:
    - dynamic-acl

- name: Validate the requested ACL exists exactly once
  ansible.builtin.assert:
    that:
      - matching_acls | length == 1
    fail_msg: >-
      IPv4 ACL {{ acl_name }} was not found exactly once. Verify the static ACL
      name before continuing. No ACL was created or modified.
  tags:
    - dynamic-acl

- name: Select the existing ACL entries
  ansible.builtin.set_fact:
    existing_acl_entries: "{{ matching_acls[0].aces | default([]) }}"
    requested_acl_hosts: >-
      {{ effective_acl_target_ips
         | map('regex_replace', '/32$', '')
         | list }}
  tags:
    - dynamic-acl

- name: Collect existing sequence numbers and matching deny hosts
  ansible.builtin.set_fact:
    existing_acl_sequences: >-
      {{ existing_acl_entries
         | selectattr('sequence', 'defined')
         | map(attribute='sequence')
         | map('int')
         | list }}
    existing_deny_hosts: []
  tags:
    - dynamic-acl

- name: Identify addresses already denied by an equivalent rule
  ansible.builtin.set_fact:
    existing_deny_hosts: >-
      {{ existing_deny_hosts + [item.destination.host] }}
  loop: "{{ existing_acl_entries }}"
  loop_control:
    label: "{{ item.sequence | default('unsequenced') }}"
  when:
    - item.grant | default('') == 'deny'
    - item.protocol | default('') == 'ip'
    - item.source.any | default(false) | bool
    - item.destination.host is defined
  tags:
    - dynamic-acl

- name: Calculate addresses requiring new entries
  ansible.builtin.set_fact:
    new_acl_hosts: >-
      {{ requested_acl_hosts
         | reject('in', existing_deny_hosts)
         | list }}
    available_acl_sequences: >-
      {{ range(sequence_start | int, sequence_end | int + 1)
         | reject('in', existing_acl_sequences)
         | list }}
  tags:
    - dynamic-acl

- name: Validate available sequence capacity
  ansible.builtin.assert:
    that:
      - available_acl_sequences | length >= new_acl_hosts | length
    fail_msg: >-
      ACL {{ acl_name }} does not have enough unused sequence numbers between
      {{ sequence_start }} and {{ sequence_end }} for all requested addresses.
      No ACL changes were made.
  tags:
    - dynamic-acl

- name: Initialize new ACL entries
  ansible.builtin.set_fact:
    acl_entries_to_add: []
  tags:
    - dynamic-acl

- name: Assign the lowest available sequences in ascending order
  ansible.builtin.set_fact:
    acl_entries_to_add: >-
      {{ acl_entries_to_add
         + [{
              'sequence': item.1,
              'grant': 'deny',
              'protocol': 'ip',
              'source': {'any': true},
              'destination': {'host': item.0}
            }] }}
  loop: "{{ new_acl_hosts | zip(available_acl_sequences) | list }}"
  loop_control:
    label: "sequence {{ item.1 }} deny ip any host {{ item.0 }}"
  tags:
    - dynamic-acl

- name: Display planned ACL additions
  ansible.builtin.debug:
    msg:
      acl: "{{ acl_name }}"
      sequence_range: "{{ sequence_start }}-{{ sequence_end }}"
      requested_addresses: "{{ effective_acl_target_ips }}"
      already_present: "{{ requested_acl_hosts | select('in', existing_deny_hosts) | list }}"
      entries_to_add: "{{ acl_entries_to_add }}"
  tags:
    - dynamic-acl

- name: Merge new deny entries into the existing ACL
  cisco.nxos.nxos_acls:
    config:
      - afi: ipv4
        acls:
          - name: "{{ acl_name }}"
            aces: "{{ acl_entries_to_add }}"
    state: merged
  when: acl_entries_to_add | length > 0
  tags:
    - dynamic-acl

- name: Report when every requested address already exists
  ansible.builtin.debug:
    msg: >-
      ACL {{ acl_name }} already contains equivalent deny entries for every
      requested address. No configuration change was required.
  when: acl_entries_to_add | length == 0
  tags:
    - dynamic-acl
