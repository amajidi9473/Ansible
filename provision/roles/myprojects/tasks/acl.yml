---

# Define the values that control this ACL workflow. The sequence range limits
# where new entries may be placed. For example, only sequences 1100 through
# 8000 are considered, and the listed /32 addresses are the default input.
- name: Define ACL insertion settings
  ansible.builtin.set_fact:
    acl_name: Internet-Control-in  # Existing IPv4 ACL that will receive new ACEs.
    sequence_start: 1100  # First sequence number permitted for allocation.
    sequence_end: 8000  # Last sequence number permitted for allocation.
    default_acl_target_ips:
      - 192.168.253.240/32
      - 192.168.253.241/32
      - 192.168.253.242/32
  tags:
    - dynamic-acl

# Choose the address list for this execution. An external system can provide
# acl_target_ips; otherwise, the default list above is used. For example, an
# externally supplied list containing 203.0.113.10/32 overrides the defaults.
- name: Resolve addresses supplied by automation
  ansible.builtin.set_fact:
    effective_acl_target_ips: >-
      {{ acl_target_ips | default(default_acl_target_ips) }}
  tags:
    - dynamic-acl

# Validate the general inputs before reading or changing an ACL. This catches
# an empty ACL name, an invalid sequence range, an empty list, or duplicates.
# For example, the same /32 submitted twice causes the workflow to stop.
- name: Validate ACL settings and address collection
  ansible.builtin.assert:
    that:
      - acl_name | length > 0  # Reject an empty ACL name.
      - sequence_start | int >= 1  # Require a positive starting sequence.
      - sequence_end | int <= 4294967294  # Enforce the NX-OS sequence maximum.
      - sequence_start | int <= sequence_end | int  # Reject a reversed range.
      - effective_acl_target_ips is sequence  # Require a list-like value.
      - effective_acl_target_ips is not string  # Reject one plain string.
      - effective_acl_target_ips | length > 0  # Require at least one address.
      - effective_acl_target_ips | length == effective_acl_target_ips | unique | length  # Reject duplicate addresses.
    fail_msg: >-
      The ACL name, sequence range, or address collection is invalid. Supply a
      nonempty, duplicate-free list through acl_target_ips.
  tags:
    - dynamic-acl

# Validate each requested address individually. Every value must be a valid
# IPv4 host prefix ending in /32; 192.168.253.240/32 is accepted, while a /24
# prefix or an octet greater than 255 is rejected.
- name: Validate every address is a correct IPv4 prefix
  ansible.builtin.assert:
    that:
      - item is string  # Require each list item to be text.
      - item is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$')  # Require IPv4 format ending in /32.
      - >-
        item | regex_replace('/32$', '') | split('.') | map('int')
        | select('greaterthan', 255) | list | length == 0
    fail_msg: >-
      {{ item }} is invalid. Every acl_target_ips entry must be a valid IPv4
      address with a /32 prefix.
  loop: "{{ effective_acl_target_ips }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - dynamic-acl

# Read all ACL configuration from the Nexus switch in structured form. This
# task is read-only. For example, it may return ACL names and ACE sequences
# such as 100, 1100, 1110, and 8000.
- name: Gather existing ACL configuration
  cisco.nxos.nxos_acls:
    state: gathered  # Read structured ACL data without changing the switch.
  register: gathered_acl_state  # Save gathered output for later tasks.
  tags:
    - dynamic-acl

# Keep only the IPv4 section because the requested rule is an IPv4 deny rule.
# Any gathered IPv6 ACL section is ignored and remains untouched.
- name: Select gathered IPv4 ACL data
  ansible.builtin.set_fact:
    ipv4_acl_families: >-
      {{ gathered_acl_state.gathered
         | selectattr('afi', 'equalto', 'ipv4')
         | list }}
  tags:
    - dynamic-acl

# Confirm that the switch returned one usable IPv4 ACL section. This prevents
# later calculations from using missing or ambiguous data. No configuration is
# changed if this validation fails.
- name: Validate IPv4 ACL data is available
  ansible.builtin.assert:
    that:
      - ipv4_acl_families | length == 1  # Require one unambiguous IPv4 section.
    fail_msg: >-
      The device did not return exactly one IPv4 ACL configuration section.
      No ACL changes were made.
  tags:
    - dynamic-acl

# Find the statically named ACL inside the IPv4 data. Only
# Internet-Control-in is selected; other ACLs are not considered for sequence
# allocation and will not be modified.
- name: Select the requested existing ACL
  ansible.builtin.set_fact:
    matching_acls: >-
      {{ ipv4_acl_families[0].acls
         | default([])
         | selectattr('name', 'equalto', acl_name)
         | list }}
  tags:
    - dynamic-acl

# Require the named ACL to exist exactly once. This protects against a spelling
# mistake that could otherwise target the wrong ACL. For example, capitalization
# differences in the configured ACL name cause this validation to stop.
- name: Validate the requested ACL exists exactly once
  ansible.builtin.assert:
    that:
      - matching_acls | length == 1  # Require one exact ACL-name match.
    fail_msg: >-
      IPv4 ACL {{ acl_name }} was not found exactly once. Verify the static ACL
      name before continuing. No ACL was created or modified.
  tags:
    - dynamic-acl

# Extract the existing ACEs and remove /32 from requested addresses because the
# NX-OS module represents IPv4 /32 destinations with the host field. For
# example, 192.168.253.240/32 becomes host 192.168.253.240.
- name: Select the existing ACL entries
  ansible.builtin.set_fact:
    existing_acl_entries: "{{ matching_acls[0].aces | default([]) }}"  # Use an empty list when the ACL has no ACEs.
    requested_acl_hosts: >-
      {{ effective_acl_target_ips
         | map('regex_replace', '/32$', '')
         | list }}
  tags:
    - dynamic-acl

# Build two working collections. One contains every used sequence number, and
# the other will contain hosts already denied by an equivalent rule. For
# example, an existing sequence 1100 is marked as unavailable.
- name: Collect existing sequence numbers and matching deny hosts
  ansible.builtin.set_fact:
    existing_acl_sequences: >-
      {{ existing_acl_entries
         | selectattr('sequence', 'defined')
         | map(attribute='sequence')
         | map('int')
         | list }}
    existing_deny_hosts: []  # Prepare a list for equivalent deny destinations.
  tags:
    - dynamic-acl

# Inspect every ACE and remember destinations already covered by the exact form
# "deny ip any host <address>". For example, an existing deny for host
# 192.168.253.240 prevents the same rule from being added again.
- name: Identify addresses already denied by an equivalent rule
  ansible.builtin.set_fact:
    existing_deny_hosts: >-
      {{ existing_deny_hosts + [item.destination.host] }}
  loop: "{{ existing_acl_entries }}"
  loop_control:
    label: "{{ item.sequence | default('unsequenced') }}"
  when:
    - item.grant | default('') == 'deny'  # Match only deny ACEs.
    - item.protocol | default('') == 'ip'  # Match only the IP protocol.
    - item.source.any | default(false) | bool  # Require a source of any.
    - item.destination.host is defined  # Require one destination host.
  tags:
    - dynamic-acl

# Remove already-covered addresses and calculate unused sequence numbers inside
# the configured range. For example, if 1100 is already used, the lowest
# available sequence may be 1101.
- name: Calculate addresses requiring new entries
  ansible.builtin.set_fact:
    new_acl_hosts: >-
      {{ requested_acl_hosts
         | reject('in', existing_deny_hosts)
         | list }}
    available_acl_sequences: >-
      {{ range(sequence_start | int, sequence_end | int + 1)
         | reject('in', existing_acl_sequences)
         | list }}
  tags:
    - dynamic-acl

# Ensure there is one unused sequence for every new address before changing the
# ACL. For example, three new addresses require at least three available
# sequence numbers in the permitted range.
- name: Validate available sequence capacity
  ansible.builtin.assert:
    that:
      - available_acl_sequences | length >= new_acl_hosts | length  # Reserve one sequence for each new host.
    fail_msg: >-
      ACL {{ acl_name }} does not have enough unused sequence numbers between
      {{ sequence_start }} and {{ sequence_end }} for all requested addresses.
      No ACL changes were made.
  tags:
    - dynamic-acl

# Start an empty list for the structured ACEs that will be sent to NX-OS. The
# next task adds one entry for every address that is not already denied.
- name: Initialize new ACL entries
  ansible.builtin.set_fact:
    acl_entries_to_add: []  # Prepare the list passed to nxos_acls.
  tags:
    - dynamic-acl

# Pair each new address with the lowest unused sequence in ascending order. For
# example, an address may become sequence 1101 with the resulting command
# "1101 deny ip any host 192.168.253.240".
- name: Assign the lowest available sequences in ascending order
  ansible.builtin.set_fact:
    acl_entries_to_add: >-
      {{ acl_entries_to_add
         + [{
              'sequence': item.1,
              'grant': 'deny',
              'protocol': 'ip',
              'source': {'any': true},
              'destination': {'host': item.0}
            }] }}
  loop: "{{ new_acl_hosts | zip(available_acl_sequences) | list }}"
  loop_control:
    label: "sequence {{ item.1 }} deny ip any host {{ item.0 }}"
  tags:
    - dynamic-acl

# Display a concise review of the ACL name, range, requested addresses,
# addresses already present, and entries about to be added. This task is
# read-only and provides a human-readable review in the job output.
- name: Display planned ACL additions
  ansible.builtin.debug:
    msg:
      acl: "{{ acl_name }}"
      sequence_range: "{{ sequence_start }}-{{ sequence_end }}"
      requested_addresses: "{{ effective_acl_target_ips }}"
      already_present: "{{ requested_acl_hosts | select('in', existing_deny_hosts) | list }}"
      entries_to_add: "{{ acl_entries_to_add }}"
  tags:
    - dynamic-acl

# Add only the newly calculated deny entries to the existing IPv4 ACL. The
# merged state preserves ACEs not supplied here. For example, sequence 1101 can
# be added without replacing the other rules in Internet-Control-in.
- name: Merge new deny entries into the existing ACL
  cisco.nxos.nxos_acls:
    config:
      - afi: ipv4  # Modify only the IPv4 address family.
        acls:
          - name: "{{ acl_name }}"
            aces: "{{ acl_entries_to_add }}"  # Supply only newly generated ACEs.
    state: merged  # Add entries while preserving existing ACL content.
  when: acl_entries_to_add | length > 0  # Skip the module when nothing is new.
  tags:
    - dynamic-acl

# Report an idempotent no-change result when equivalent deny entries already
# cover every requested address. The NX-OS configuration module is skipped in
# that case, leaving the existing ACL unchanged.
- name: Report when every requested address already exists
  ansible.builtin.debug:
    msg: >-
      ACL {{ acl_name }} already contains equivalent deny entries for every
      requested address. No configuration change was required.
  when: acl_entries_to_add | length == 0  # Report the idempotent no-change case.
  tags:
    - dynamic-acl
