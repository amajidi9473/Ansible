---

- name: Define dynamic VLAN settings
  ansible.builtin.set_fact:
    trunk_interface: Ethernet1/10
    vlan_count: 3
  tags:
    - dynamic-vlan

- name: Gather existing VLAN configuration
  cisco.nxos.nxos_vlans:
    state: gathered
  register: vlan_state
  tags:
    - dynamic-vlan

- name: Gather existing Layer 2 interface configuration
  cisco.nxos.nxos_l2_interfaces:
    state: gathered
  register: l2_state
  tags:
    - dynamic-vlan

- name: Normalize existing VLAN and trunk data
  ansible.builtin.set_fact:
    existing_vlan_ids: >-
      {{ vlan_state.gathered
         | map(attribute='vlan_id')
         | map('int')
         | list }}
    matching_trunks: >-
      {{ l2_state.gathered
         | selectattr('name', 'equalto', trunk_interface)
         | list }}
  tags:
    - dynamic-vlan

- name: Select the requested trunk interface
  ansible.builtin.set_fact:
    trunk_state: "{{ (matching_trunks | first) | default({}) }}"
  tags:
    - dynamic-vlan

- name: Validate gathered VLAN and trunk data before making changes
  ansible.builtin.assert:
    that:
      - existing_vlan_ids | length > 0
      - matching_trunks | length == 1
      - trunk_state.trunk is defined
      - not (trunk_state.trunk.allowed_vlans_none | default(false) | bool)
    fail_msg: >-
      The device must have VLAN data and exactly one matching trunk named
      {{ trunk_interface }}. A trunk explicitly configured with
      "allowed vlan none" will not be modified.
  tags:
    - dynamic-vlan

- name: Combine existing VLAN IDs from every targeted device
  ansible.builtin.set_fact:
    all_existing_vlan_ids: >-
      {{ ansible_play_hosts
         | map('extract', hostvars, 'existing_vlan_ids')
         | flatten
         | map('int')
         | list }}
  tags:
    - dynamic-vlan

- name: Calculate the largest existing VLAN ID
  ansible.builtin.set_fact:
    largest_vlan_id: "{{ all_existing_vlan_ids | max | int }}"
  tags:
    - dynamic-vlan

- name: Validate room for the requested VLANs
  ansible.builtin.assert:
    that:
      - largest_vlan_id | int + vlan_count | int <= 4094
    fail_msg: >-
      Cannot create {{ vlan_count }} VLANs after VLAN {{ largest_vlan_id }}
      because NX-OS VLAN IDs cannot exceed 4094.
  tags:
    - dynamic-vlan

- name: Calculate the next VLAN IDs
  ansible.builtin.set_fact:
    new_vlan_ids: >-
      {{ range(
           largest_vlan_id | int + 1,
           largest_vlan_id | int + vlan_count | int + 1
         ) | list }}
    existing_allowed_vlans: >-
      {{ trunk_state.trunk.allowed_vlans | default('') | string }}
  tags:
    - dynamic-vlan

- name: Display the planned dynamic VLAN changes
  ansible.builtin.debug:
    msg:
      - "Largest VLAN across targeted devices: {{ largest_vlan_id }}"
      - "VLANs to create: {{ new_vlan_ids | join(',') }}"
      - "Target trunk: {{ trunk_interface }}"
      - >-
        Trunk action: {{ 'merge the new VLANs into ' + existing_allowed_vlans
        if existing_allowed_vlans | length > 0
        else 'none; the trunk already allows all VLANs by default' }}
  tags:
    - dynamic-vlan

- name: Create new VLANs without affecting existing VLANs
  cisco.nxos.nxos_vlans:
    config:
      - vlan_id: "{{ item }}"
        name: "ansible-vlan-{{ item }}"
        enabled: true
        state: active
    state: merged
  loop: "{{ new_vlan_ids }}"
  tags:
    - dynamic-vlan

- name: Merge new VLANs into the explicit trunk allowed list
  cisco.nxos.nxos_l2_interfaces:
    config:
      - name: "{{ trunk_interface }}"
        trunk:
          allowed_vlans: "{{ new_vlan_ids | join(',') }}"
    state: merged
  when: existing_allowed_vlans | length > 0
  tags:
    - dynamic-vlan

- name: Report when no trunk update is required
  ansible.builtin.debug:
    msg: >-
      {{ trunk_interface }} has no explicit allowed VLAN list, so NX-OS already
      allows the newly created VLANs and no trunk change was sent.
  when: existing_allowed_vlans | length == 0
  tags:
    - dynamic-vlan
